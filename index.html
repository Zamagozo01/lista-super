<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LISTA SUPER ZAMARRIPA CARDENAS</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>">
  <style>
    :root {
      --orange: #ff7a1a;
      --orange-dark: #e96200;
      --yellow: #fff4df;
      --cream: #fffaf2;
      --green: #2fbf71;
      --red: #ef476f;
      --blue: #2d9cdb;
      --purple: #8e5cf7;
      --text: #25313f;
      --muted: #697586;
      --border: #ece2d3;
      --card: #ffffff;
      --shadow: 0 12px 30px rgba(37, 49, 63, 0.12);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255, 122, 26, 0.18), transparent 32%),
        radial-gradient(circle at top right, rgba(47, 191, 113, 0.16), transparent 30%),
        linear-gradient(135deg, #fffaf2 0%, #fff4df 100%);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      padding: 28px 18px 18px;
      text-align: center;
    }

    .app-title {
      margin: 0;
      color: var(--orange);
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 950;
      letter-spacing: -1px;
      text-transform: uppercase;
      text-shadow: 0 4px 0 rgba(255, 122, 26, 0.15);
    }

    .subtitle {
      margin: 10px auto 0;
      color: var(--muted);
      font-weight: 650;
      max-width: 850px;
      line-height: 1.5;
    }

    .layout {
      width: min(1500px, calc(100% - 28px));
      margin: 0 auto 40px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 390px;
      gap: 22px;
      align-items: start;
    }

    .main-panel,
    .side-panel,
    .otros-panel {
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(236, 226, 211, 0.9);
      backdrop-filter: blur(12px);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .main-panel {
      padding: 18px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      margin-bottom: 16px;
    }

    .search-box {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 15px 16px;
      font-size: 1rem;
      background: white;
      outline: none;
      color: var(--text);
      box-shadow: 0 8px 18px rgba(37, 49, 63, 0.06);
    }

    .search-box:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 4px rgba(255, 122, 26, 0.14);
    }

    .category-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
      max-width: 100%;
    }

    .filter-btn,
    .action-btn,
    .small-btn,
    .copy-btn,
    .clear-btn,
    .add-other-btn {
      border: 0;
      cursor: pointer;
      font-weight: 800;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .filter-btn {
      padding: 10px 13px;
      border-radius: 999px;
      color: var(--text);
      background: #fff;
      border: 1px solid var(--border);
      box-shadow: 0 8px 18px rgba(37, 49, 63, 0.06);
      font-size: 0.86rem;
    }

    .filter-btn:hover,
    .action-btn:hover,
    .small-btn:hover,
    .copy-btn:hover,
    .clear-btn:hover,
    .add-other-btn:hover {
      transform: translateY(-2px);
    }

    .filter-btn.active {
      background: var(--orange);
      color: white;
      border-color: var(--orange);
      box-shadow: 0 10px 22px rgba(255, 122, 26, 0.25);
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .product-card {
      position: relative;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 16px;
      min-height: 245px;
      box-shadow: 0 10px 22px rgba(37, 49, 63, 0.07);
      display: flex;
      flex-direction: column;
      gap: 11px;
      overflow: hidden;
    }

    .product-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 7px;
      background: linear-gradient(90deg, var(--orange), #ffd166, var(--green));
    }

    .favorite-btn {
      position: absolute;
      top: 13px;
      right: 13px;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: #fff2f6;
      color: #c2a4ad;
      font-size: 1.1rem;
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: 0 8px 16px rgba(239, 71, 111, 0.15);
      transition: transform 0.18s ease, color 0.18s ease, background 0.18s ease;
    }

    .favorite-btn.active {
      background: #ffe2ea;
      color: var(--red);
      transform: scale(1.06);
    }

    .product-emoji {
      font-size: 2.7rem;
      line-height: 1;
      margin-top: 10px;
    }

    .product-name {
      font-size: 1.05rem;
      font-weight: 900;
      line-height: 1.2;
      padding-right: 35px;
    }

    .category-pill {
      width: fit-content;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--yellow);
      color: var(--orange-dark);
      font-size: 0.77rem;
      font-weight: 850;
    }

    .note {
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.35;
      min-height: 20px;
    }

    .price-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
      margin-top: auto;
    }

    .price-input,
    .budget-input,
    .other-input {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 11px 12px;
      width: 100%;
      outline: none;
      font-weight: 750;
      background: #fff;
      color: var(--text);
    }

    .price-input:focus,
    .budget-input:focus,
    .other-input:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 4px rgba(255, 122, 26, 0.13);
    }

    .quantity-control {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      gap: 8px;
    }

    .qty-btn {
      border: 0;
      background: var(--orange);
      color: white;
      border-radius: 14px;
      height: 42px;
      font-size: 1.4rem;
      font-weight: 950;
      cursor: pointer;
      box-shadow: 0 9px 18px rgba(255, 122, 26, 0.22);
    }

    .qty-display {
      height: 42px;
      border-radius: 14px;
      background: #f8f3eb;
      display: grid;
      place-items: center;
      font-weight: 950;
      font-size: 1.05rem;
    }

    .side-panel {
      padding: 18px;
      position: sticky;
      top: 14px;
      max-height: calc(100vh - 28px);
      overflow: auto;
    }

    .side-title {
      margin: 0 0 12px;
      font-size: 1.35rem;
      font-weight: 950;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .budget-box,
    .summary-box,
    .favorites-box {
      background: white;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 15px;
      margin-bottom: 14px;
      box-shadow: 0 8px 18px rgba(37, 49, 63, 0.06);
    }

    .budget-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin: 12px 0;
    }

    .stat {
      background: #fff8ed;
      border-radius: 16px;
      padding: 11px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 800;
    }

    .stat-value {
      margin-top: 4px;
      font-weight: 950;
      font-size: 1rem;
    }

    .progress-wrap {
      height: 14px;
      background: #f1e8dd;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--green), #ffd166, var(--orange));
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .progress-bar.over {
      background: linear-gradient(90deg, #ff8a8a, var(--red));
    }

    .list-items,
    .favorites-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .empty-message {
      color: var(--muted);
      font-weight: 700;
      background: #faf6ef;
      border-radius: 16px;
      padding: 13px;
      text-align: center;
    }

    .list-item,
    .favorite-item {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 11px;
      background: #fffdf9;
    }

    .item-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .item-name {
      font-weight: 950;
      line-height: 1.25;
    }

    .item-meta {
      color: var(--muted);
      font-size: 0.79rem;
      font-weight: 700;
      margin-top: 4px;
      line-height: 1.35;
    }

    .item-total {
      font-weight: 950;
      color: var(--green);
      white-space: nowrap;
    }

    .favorite-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .small-btn {
      background: var(--green);
      color: white;
      border-radius: 13px;
      padding: 9px 11px;
      box-shadow: 0 8px 16px rgba(47, 191, 113, 0.2);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .copy-btn {
      background: var(--blue);
      color: white;
      border-radius: 16px;
      padding: 13px;
      box-shadow: 0 8px 16px rgba(45, 156, 219, 0.22);
    }

    .clear-btn {
      background: var(--red);
      color: white;
      border-radius: 16px;
      padding: 13px;
      box-shadow: 0 8px 16px rgba(239, 71, 111, 0.22);
    }

    .otros-panel {
      width: min(1500px, calc(100% - 28px));
      margin: 0 auto 42px;
      padding: 18px;
    }

    .otros-grid {
      display: grid;
      grid-template-columns: 1.2fr 1.2fr 0.7fr 0.7fr 0.9fr auto;
      gap: 10px;
      align-items: end;
    }

    .input-group label {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 850;
      margin-bottom: 6px;
    }

    .add-other-btn {
      background: var(--purple);
      color: white;
      border-radius: 14px;
      padding: 12px 15px;
      min-height: 44px;
      box-shadow: 0 8px 16px rgba(142, 92, 247, 0.22);
      white-space: nowrap;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%) translateY(20px);
      background: #25313f;
      color: white;
      padding: 13px 18px;
      border-radius: 999px;
      font-weight: 850;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 50;
      box-shadow: var(--shadow);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 1160px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .side-panel {
        position: static;
        max-height: none;
      }

      .products-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      body {
        background:
          radial-gradient(circle at top left, rgba(255, 122, 26, 0.14), transparent 34%),
          radial-gradient(circle at top right, rgba(47, 191, 113, 0.12), transparent 32%),
          linear-gradient(135deg, #fffaf2 0%, #fff4df 100%);
      }

      header {
        padding: 16px 12px 10px;
      }

      .app-title {
        font-size: clamp(1.38rem, 7.2vw, 2rem);
        line-height: 1.08;
        letter-spacing: -0.4px;
        text-shadow: 0 3px 0 rgba(255, 122, 26, 0.12);
      }

      .subtitle {
        margin-top: 7px;
        max-width: 23rem;
        font-size: clamp(0.86rem, 3.4vw, 0.98rem);
        line-height: 1.32;
      }

      .layout,
      .otros-panel {
        width: min(1500px, calc(100% - 14px));
      }

      .layout {
        gap: 12px;
        margin-bottom: 14px;
      }

      .main-panel,
      .side-panel,
      .otros-panel {
        border-radius: 17px;
        padding: 10px;
      }

      .toolbar {
        grid-template-columns: 1fr;
        gap: 8px;
        margin-bottom: 10px;
      }

      .search-box {
        min-height: 42px;
        border-radius: 14px;
        padding: 8px 12px;
        font-size: 16px;
      }

      .products-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .product-card {
        min-height: 0;
        border-radius: 17px;
        padding: 11px 11px 10px;
        gap: 5px;
        box-shadow: 0 7px 16px rgba(37, 49, 63, 0.07);
      }

      .product-card::before {
        height: 5px;
      }

      .favorite-btn {
        top: 9px;
        right: 9px;
        width: 34px;
        height: 34px;
        font-size: 1rem;
        box-shadow: 0 6px 13px rgba(239, 71, 111, 0.13);
      }

      .product-emoji {
        font-size: 1.95rem;
        margin-top: 4px;
      }

      .product-name {
        font-size: 0.95rem;
        line-height: 1.18;
        padding-right: 34px;
      }

      .category-pill {
        padding: 3px 8px;
        font-size: 0.66rem;
      }

      .note {
        font-size: 0.75rem;
        line-height: 1.2;
        min-height: 0;
      }

      .price-row {
        gap: 5px;
        margin-top: 0;
      }

      .price-input,
      .budget-input,
      .other-input {
        min-height: 40px;
        border-radius: 12px;
        padding: 6px 10px;
        font-size: 16px;
      }

      .quantity-control {
        grid-template-columns: 40px minmax(0, 1fr) 40px;
        gap: 6px;
      }

      .qty-btn,
      .qty-display {
        height: 40px;
        border-radius: 12px;
      }

      .qty-btn {
        font-size: 1.24rem;
        box-shadow: 0 7px 14px rgba(255, 122, 26, 0.2);
      }

      .qty-display {
        font-size: 0.98rem;
      }

      .otros-grid {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .budget-stats,
      .actions {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .category-filters {
        flex-wrap: nowrap;
        overflow-x: auto;
        gap: 8px;
        margin: 0 -10px 10px;
        padding: 0 10px 6px;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
        scroll-padding-inline: 10px;
        mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 30px), transparent);
      }

      .category-filters::-webkit-scrollbar {
        display: none;
      }

      .filter-btn {
        flex: 0 0 auto;
        white-space: nowrap;
        padding: 8px 10px;
        font-size: 0.78rem;
        box-shadow: 0 6px 14px rgba(37, 49, 63, 0.06);
      }

      .side-title {
        margin-bottom: 9px;
        font-size: 1.08rem;
      }

      .budget-box,
      .summary-box,
      .favorites-box {
        border-radius: 16px;
        padding: 11px;
        margin-bottom: 10px;
      }

      .stat {
        border-radius: 13px;
        padding: 9px;
      }

      .stat-label {
        font-size: 0.7rem;
      }

      .stat-value {
        font-size: 0.92rem;
      }

      .progress-wrap {
        height: 11px;
      }

      .list-items,
      .favorites-list {
        gap: 8px;
      }

      .empty-message,
      .list-item,
      .favorite-item {
        border-radius: 13px;
        padding: 10px;
      }

      .item-name {
        font-size: 0.92rem;
      }

      .item-meta {
        font-size: 0.74rem;
      }

      .small-btn,
      .copy-btn,
      .clear-btn,
      .add-other-btn {
        min-height: 40px;
        border-radius: 12px;
        padding: 9px 11px;
      }

      .otros-panel {
        margin-bottom: 28px;
      }

      .input-group label {
        font-size: 0.72rem;
        margin-bottom: 4px;
      }
    }

    @media (max-width: 430px) {
      header {
        padding-top: 13px;
      }

      .app-title {
        font-size: clamp(1.22rem, 7vw, 1.8rem);
      }

      .subtitle {
        font-size: 0.82rem;
      }

      .product-card {
        padding: 10px;
      }
    }

    @media (max-width: 340px) {
      .layout,
      .otros-panel {
        width: min(1500px, calc(100% - 10px));
      }

      .main-panel,
      .side-panel,
      .otros-panel {
        padding: 8px;
      }

      .category-filters {
        margin-inline: -8px;
        padding-inline: 8px;
      }

      .quantity-control {
        grid-template-columns: 38px minmax(0, 1fr) 38px;
      }

      .qty-btn,
      .qty-display {
        height: 40px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1 class="app-title">LISTA SUPER ZAMARRIPA CARDENAS</h1>
    <p class="subtitle">Catálogo interactivo para organizar productos, cantidades, favoritos, precios y presupuesto.</p>
  </header>

  <section class="layout">
    <main class="main-panel">
      <div class="toolbar">
        <input id="searchInput" class="search-box" type="search" placeholder="Buscar producto..." />
      </div>

      <div id="categoryFilters" class="category-filters"></div>
      <div id="productsGrid" class="products-grid"></div>
    </main>

    <aside class="side-panel">
      <section class="budget-box">
        <h2 class="side-title">💰 Presupuesto</h2>
        <input id="budgetInput" class="budget-input" type="number" min="0" step="0.01" placeholder="Escribe tu presupuesto total" />

        <div class="budget-stats">
          <div class="stat">
            <div class="stat-label">Total estimado</div>
            <div id="totalEstimated" class="stat-value">$0</div>
          </div>
          <div class="stat">
            <div class="stat-label">Restante o excedente</div>
            <div id="remainingBudget" class="stat-value">$0</div>
          </div>
          <div class="stat">
            <div class="stat-label">Ingredientes distintos</div>
            <div id="distinctItems" class="stat-value">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">Cantidad total</div>
            <div id="totalQuantity" class="stat-value">0</div>
          </div>
        </div>

        <div class="progress-wrap">
          <div id="budgetProgress" class="progress-bar"></div>
        </div>
      </section>

      <section class="favorites-box">
        <h2 class="side-title">❤️ Favoritos</h2>
        <div id="favoritesList" class="favorites-list"></div>
      </section>

      <section class="summary-box">
        <h2 class="side-title">🛒 Mi lista</h2>
        <div id="listItems" class="list-items"></div>

        <div class="actions">
          <button id="copyListBtn" class="copy-btn">Copiar lista</button>
          <button id="clearListBtn" class="clear-btn">Limpiar lista</button>
        </div>
      </section>
    </aside>
  </section>

  <section class="otros-panel">
    <h2 class="side-title">🛍️ Otros</h2>
    <div class="otros-grid">
      <div class="input-group">
        <label for="otherName">Nombre del producto</label>
        <input id="otherName" class="other-input" type="text" placeholder="Ej. Salsa especial" />
      </div>

      <div class="input-group">
        <label for="otherNote">Nota opcional</label>
        <input id="otherNote" class="other-input" type="text" placeholder="Ej. Marca, tamaño, presentación" />
      </div>

      <div class="input-group">
        <label for="otherEmoji">Emoji</label>
        <input id="otherEmoji" class="other-input" type="text" maxlength="4" placeholder="🛒" />
      </div>

      <div class="input-group">
        <label for="otherQuantity">Cantidad</label>
        <input id="otherQuantity" class="other-input" type="number" min="1" step="1" value="1" />
      </div>

      <div class="input-group">
        <label for="otherPrice">Precio unitario</label>
        <input id="otherPrice" class="other-input" type="number" min="0" step="0.01" placeholder="$0" />
      </div>

      <button id="addOtherBtn" class="add-other-btn">Agregar a otros</button>
    </div>
  </section>

  <div id="toast" class="toast"></div>

  <script>
    const products = [
      { id: "proteinas-001", emoji: "🥚", name: "Huevo", category: "Proteínas", note: "" },
      { id: "proteinas-002", emoji: "🥚", name: "Claras de huevo", category: "Proteínas", note: "" },
      { id: "proteinas-003", emoji: "🥩", name: "Arrachera de res", category: "Proteínas", note: "" },
      { id: "proteinas-004", emoji: "🍗", name: "Pollo deshebrado", category: "Proteínas", note: "" },
      { id: "proteinas-005", emoji: "🍗", name: "Carne molida de pollo", category: "Proteínas", note: "" },

    ];

    let selectedCategory = "Todas";
    let quantities = {};
    let prices = {};
    let favorites = {};
    let otherCounter = 1;

    const productsGrid = document.getElementById("productsGrid");
    const categoryFilters = document.getElementById("categoryFilters");
    const searchInput = document.getElementById("searchInput");
    const budgetInput = document.getElementById("budgetInput");
    const totalEstimated = document.getElementById("totalEstimated");
    const remainingBudget = document.getElementById("remainingBudget");
    const distinctItems = document.getElementById("distinctItems");
    const totalQuantity = document.getElementById("totalQuantity");
    const budgetProgress = document.getElementById("budgetProgress");
    const listItems = document.getElementById("listItems");
    const favoritesList = document.getElementById("favoritesList");
    const copyListBtn = document.getElementById("copyListBtn");
    const clearListBtn = document.getElementById("clearListBtn");
    const addOtherBtn = document.getElementById("addOtherBtn");
    const otherName = document.getElementById("otherName");
    const otherNote = document.getElementById("otherNote");
    const otherEmoji = document.getElementById("otherEmoji");
    const otherQuantity = document.getElementById("otherQuantity");
    const otherPrice = document.getElementById("otherPrice");
    const toast = document.getElementById("toast");

    function money(value) {
      const numberValue = Number(value) || 0;
      return "$" + numberValue.toLocaleString("es-MX", {
        minimumFractionDigits: numberValue % 1 === 0 ? 0 : 2,
        maximumFractionDigits: 2
      });
    }

    function normalizeText(text) {
      return text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function getCategories() {
      return ["Todas", ...new Set(products.map(product => product.category))];
    }

    function renderFilters() {
      categoryFilters.innerHTML = "";
      getCategories().forEach(category => {
        const button = document.createElement("button");
        button.className = "filter-btn" + (selectedCategory === category ? " active" : "");
        button.textContent = category;
        button.addEventListener("click", () => {
          selectedCategory = category;
          renderFilters();
          renderProducts();
        });
        categoryFilters.appendChild(button);
      });
    }

    function getFilteredProducts() {
      const query = normalizeText(searchInput.value.trim());

      return products.filter(product => {
        const matchesCategory = selectedCategory === "Todas" || product.category === selectedCategory;
        const matchesSearch =
          normalizeText(product.name).includes(query) ||
          normalizeText(product.category).includes(query) ||
          normalizeText(product.note || "").includes(query);

        return matchesCategory && matchesSearch;
      });
    }

    function renderProducts() {
      const filteredProducts = getFilteredProducts();
      productsGrid.innerHTML = "";

      if (filteredProducts.length === 0) {
        productsGrid.innerHTML = `<div class="empty-message">No se encontraron productos.</div>`;
        return;
      }

      filteredProducts.forEach(product => {
        const quantity = quantities[product.id] || 0;
        const price = prices[product.id] ?? "";

        const card = document.createElement("article");
        card.className = "product-card";
        card.innerHTML = `
          <button class="favorite-btn ${favorites[product.id] ? "active" : ""}" aria-label="Favorito">♥</button>
          <div class="product-emoji">${product.emoji}</div>
          <div class="product-name">${product.name}</div>
          <div class="category-pill">${product.category}</div>
          <div class="note">${product.note || "Agrega cantidad y precio si aplica."}</div>
          <div class="price-row">
            <input class="price-input" type="number" min="0" step="0.01" placeholder="Precio unitario manual" value="${price}">
            <div class="quantity-control">
              <button class="qty-btn minus-btn">−</button>
              <div class="qty-display">${quantity}</div>
              <button class="qty-btn plus-btn">+</button>
            </div>
          </div>
        `;

        card.querySelector(".favorite-btn").addEventListener("click", () => {
          favorites[product.id] = !favorites[product.id];
          renderProducts();
          updateSummary();
        });

        card.querySelector(".price-input").addEventListener("input", event => {
          prices[product.id] = Number(event.target.value) || 0;
          updateSummary();
        });

        card.querySelector(".minus-btn").addEventListener("click", () => {
          quantities[product.id] = Math.max(0, (quantities[product.id] || 0) - 1);
          renderProducts();
          updateSummary();
        });

        card.querySelector(".plus-btn").addEventListener("click", () => {
          quantities[product.id] = (quantities[product.id] || 0) + 1;
          renderProducts();
          updateSummary();
        });

        productsGrid.appendChild(card);
      });
    }

    function getSelectedItems() {
      return products
        .filter(product => (quantities[product.id] || 0) > 0)
        .map(product => {
          const quantity = quantities[product.id] || 0;
          const unitPrice = prices[product.id] || 0;
          return {
            ...product,
            quantity,
            unitPrice,
            total: quantity * unitPrice
          };
        });
    }

    function getFavoriteItems() {
      return products.filter(product => favorites[product.id]);
    }

    function updateSummary() {
      const selectedItems = getSelectedItems();
      const favoriteItems = getFavoriteItems();

      const estimatedTotal = selectedItems.reduce((sum, item) => sum + item.total, 0);
      const quantityTotal = selectedItems.reduce((sum, item) => sum + item.quantity, 0);
      const budget = Number(budgetInput.value) || 0;
      const remaining = budget - estimatedTotal;

      totalEstimated.textContent = money(estimatedTotal);
      distinctItems.textContent = selectedItems.length;
      totalQuantity.textContent = quantityTotal;

      if (budget > 0) {
        remainingBudget.textContent = remaining >= 0 ? `${money(remaining)} restante` : `${money(Math.abs(remaining))} excedente`;
        remainingBudget.style.color = remaining >= 0 ? "var(--green)" : "var(--red)";
        const progress = Math.min((estimatedTotal / budget) * 100, 100);
        budgetProgress.style.width = `${progress}%`;
        budgetProgress.classList.toggle("over", estimatedTotal > budget);
      } else {
        remainingBudget.textContent = "$0";
        remainingBudget.style.color = "var(--text)";
        budgetProgress.style.width = "0%";
        budgetProgress.classList.remove("over");
      }

      renderListItems(selectedItems);
      renderFavorites(favoriteItems);
    }

    function renderListItems(selectedItems) {
      listItems.innerHTML = "";

      if (selectedItems.length === 0) {
        listItems.innerHTML = `<div class="empty-message">Aún no has agregado productos.</div>`;
        return;
      }

      selectedItems.forEach(item => {
        const itemElement = document.createElement("div");
        itemElement.className = "list-item";
        itemElement.innerHTML = `
          <div class="item-top">
            <div>
              <div class="item-name">${item.emoji} ${item.name}</div>
              <div class="item-meta">${item.category} · Cantidad: ${item.quantity} · ${money(item.unitPrice)} c/u</div>
            </div>
            <div class="item-total">${money(item.total)}</div>
          </div>
        `;
        listItems.appendChild(itemElement);
      });
    }

    function renderFavorites(favoriteItems) {
      favoritesList.innerHTML = "";

      if (favoriteItems.length === 0) {
        favoritesList.innerHTML = `<div class="empty-message">Marca productos con corazón.</div>`;
        return;
      }

      favoriteItems.forEach(item => {
        const favoriteElement = document.createElement("div");
        favoriteElement.className = "favorite-item";
        favoriteElement.innerHTML = `
          <div>
            <div class="item-name">${item.emoji} ${item.name}</div>
            <div class="item-meta">${item.category}</div>
          </div>
          <button class="small-btn">+1</button>
        `;

        favoriteElement.querySelector(".small-btn").addEventListener("click", () => {
          quantities[item.id] = (quantities[item.id] || 0) + 1;
          renderProducts();
          updateSummary();
        });

        favoritesList.appendChild(favoriteElement);
      });
    }

    function addOtherProduct() {
      const name = otherName.value.trim();
      const note = otherNote.value.trim();
      const emoji = otherEmoji.value.trim() || "🛒";
      const quantity = Math.max(1, Number(otherQuantity.value) || 1);
      const unitPrice = Number(otherPrice.value) || 0;

      if (!name) {
        showToast("Escribe el nombre del producto.");
        return;
      }

      const id = `otros-${Date.now()}-${otherCounter++}`;
      const newProduct = {
        id,
        emoji,
        name,
        category: "Otros",
        note
      };

      products.push(newProduct);
      quantities[id] = quantity;
      prices[id] = unitPrice;

      otherName.value = "";
      otherNote.value = "";
      otherEmoji.value = "";
      otherQuantity.value = "1";
      otherPrice.value = "";

      renderFilters();
      renderProducts();
      updateSummary();
      showToast("Producto agregado a Otros.");
    }

    function copyList() {
      const selectedItems = getSelectedItems();
      const budget = Number(budgetInput.value) || 0;
      const estimatedTotal = selectedItems.reduce((sum, item) => sum + item.total, 0);
      const remaining = budget - estimatedTotal;

      if (selectedItems.length === 0) {
        showToast("Tu lista está vacía.");
        return;
      }

      const groupedItems = selectedItems.reduce((groups, item) => {
        if (!groups[item.category]) groups[item.category] = [];
        groups[item.category].push(item);
        return groups;
      }, {});

      let text = "Lista de súper:\n\n";

      Object.keys(groupedItems).forEach(category => {
        text += `${category}:\n`;
        groupedItems[category].forEach(item => {
          text += `- ${item.quantity} x ${item.emoji} ${item.name} | ${money(item.unitPrice)} c/u | Total: ${money(item.total)}\n`;
        });
        text += "\n";
      });

      text += `Total estimado: ${money(estimatedTotal)}\n`;
      text += `Presupuesto: ${money(budget)}\n`;
      text += remaining >= 0 ? `Restante: ${money(remaining)}` : `Excedente: ${money(Math.abs(remaining))}`;

      navigator.clipboard.writeText(text)
        .then(() => showToast("Lista copiada."))
        .catch(() => {
          const tempTextarea = document.createElement("textarea");
          tempTextarea.value = text;
          document.body.appendChild(tempTextarea);
          tempTextarea.select();
          document.execCommand("copy");
          document.body.removeChild(tempTextarea);
          showToast("Lista copiada.");
        });
    }

    function clearList() {
      quantities = {};
      prices = {};
      products
        .filter(product => product.category === "Otros")
        .forEach(product => {
          delete favorites[product.id];
        });

      for (let i = products.length - 1; i >= 0; i--) {
        if (products[i].category === "Otros") {
          products.splice(i, 1);
        }
      }

      renderFilters();
      renderProducts();
      updateSummary();
      showToast("Lista limpiada.");
    }

    searchInput.addEventListener("input", renderProducts);
    budgetInput.addEventListener("input", updateSummary);
    copyListBtn.addEventListener("click", copyList);
    clearListBtn.addEventListener("click", clearList);
    addOtherBtn.addEventListener("click", addOtherProduct);

    [otherName, otherNote, otherEmoji, otherQuantity, otherPrice].forEach(input => {
      input.addEventListener("keydown", event => {
        if (event.key === "Enter") addOtherProduct();
      });
    });

    renderFilters();
    renderProducts();
    updateSummary();
  </script>
</body>
</html>
