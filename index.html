<body>
<header><h1>LISTA SUPER ZAMARRIPA CARDENAS</h1><p class="sub">Catálogo interactivo con favoritos, presupuesto, Excel y Word.</p></header>

</aside></section>

let products=[],quantities={},prices={},favorites={},notes={},selectedCategory="Todas";const $=id=>document.getElementById(id);const slug=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-");const norm=s=>String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase().replace(/\s+/g," ");Object.entries(raw).forEach(([category,items])=>items.forEach((x,i)=>products.push({id:slug(category)+"-"+i,emoji:x[0],name:x[1],category,note:x[2]||""})));
const money=n=>"$"+(Number(n)||0).toLocaleString("es-MX",{minimumFractionDigits:(Number(n)||0)%1?2:0,maximumFractionDigits:2});function toast(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1800)}function save(){localStorage.setItem("listaSuperZamarripa",JSON.stringify({products,quantities,prices,favorites,notes,budget:$("budget").value}))}function load(){try{const s=JSON.parse(localStorage.getItem("listaSuperZamarripa"));if(!s)return;if(Array.isArray(s.products))products=s.products;quantities=s.quantities||{};prices=s.prices||{};favorites=s.favorites||{};notes=s.notes||{};setTimeout(()=>$("budget").value=s.budget||"",0)}catch{}}load();
function renderFilters(){const cats=["Todas",...new Set(products.map(p=>p.category))];$("filters").innerHTML="";cats.forEach(c=>{const b=document.createElement("button");b.className="btn filter"+(c===selectedCategory?" active":"");b.textContent=c;b.onclick=()=>{selectedCategory=c;renderFilters();renderProducts()};$("filters").appendChild(b)})}
function renderProducts(){const q=norm($("search").value),list=products.filter(p=>(selectedCategory==="Todas"||p.category===selectedCategory)&&(!q||norm(p.name+" "+p.category+" "+(notes[p.id]||p.note)).includes(q)));$("grid").innerHTML=list.length?"":"<div class='empty'>No se encontraron productos.</div>";list.forEach(p=>{const d=document.createElement("article");d.className="card";d.innerHTML=`<button class="heart ${favorites[p.id]?"active":""}">♥</button><div class="emoji">${p.emoji}</div><div class="name">${p.name}</div><div class="pill">${p.category}</div><div class="note">${notes[p.id]||p.note||"Agrega cantidad y precio si aplica."}</div><input class="input price" type="number" min="0" step=".01" placeholder="Precio unitario manual" value="${prices[p.id]??""}"><div class="qty"><button class="minus">−</button><span>${quantities[p.id]||0}</span><button class="plus">+</button></div>`;d.querySelector(".heart").onclick=()=>{favorites[p.id]=!favorites[p.id];renderProducts();update()};d.querySelector(".price").oninput=e=>{prices[p.id]=Number(e.target.value)||0;update()};d.querySelector(".minus").onclick=()=>{quantities[p.id]=Math.max(0,(quantities[p.id]||0)-1);renderProducts();update()};d.querySelector(".plus").onclick=()=>{quantities[p.id]=(quantities[p.id]||0)+1;renderProducts();update()};$("grid").appendChild(d)})}
function selected(){return products.filter(p=>(quantities[p.id]||0)>0).map(p=>({...p,note:notes[p.id]||p.note,quantity:quantities[p.id],unitPrice:prices[p.id]||0,total:(quantities[p.id]||0)*(prices[p.id]||0)}))}
function update(){const list=selected(),total=list.reduce((a,x)=>a+x.total,0),qty=list.reduce((a,x)=>a+x.quantity,0),budget=Number($("budget").value)||0,rem=budget-total;$("total").textContent=money(total);$("distinct").textContent=list.length;$("quantityTotal").textContent=qty;$("remaining").textContent=budget?(rem>=0?money(rem)+" restante":money(Math.abs(rem))+" excedente"):"$0";$("remaining").style.color=rem<0?"var(--r)":"var(--g)";$("bar").style.width=budget?Math.min(total/budget*100,100)+"%":"0";$("bar").classList.toggle("over",budget>0&&total>budget);$("myList").innerHTML=list.length?"":"<div class='empty'>Aún no has agregado productos.</div>";list.forEach(x=>{const d=document.createElement("div");d.className="item";d.innerHTML=`<div class="row"><div><strong>${x.emoji} ${x.name}</strong><div class="meta">${x.category} · Cantidad: ${x.quantity} · ${money(x.unitPrice)} c/u</div></div><div class="total">${money(x.total)}</div></div>`;$("myList").appendChild(d)});const favs=products.filter(p=>favorites[p.id]);$("favorites").innerHTML=favs.length?"":"<div class='empty'>Marca productos con corazón.</div>";favs.forEach(p=>{const d=document.createElement("div");d.className="item fav";d.innerHTML=`<div><strong>${p.emoji} ${p.name}</strong><div class="meta">${p.category}</div></div><button class="btn green">+1</button>`;d.querySelector("button").onclick=()=>{quantities[p.id]=(quantities[p.id]||0)+1;renderProducts();update()};$("favorites").appendChild(d)});save()}
function addOther(){const name=$("otherName").value.trim();if(!name)return toast("Escribe el nombre del producto.");const p={id:"otros-"+Date.now(),emoji:$("otherEmoji").value.trim()||"🛒",name,category:"Otros",note:$("otherNote").value.trim()};products.push(p);quantities[p.id]=Math.max(1,Number($("otherQty").value)||1);prices[p.id]=Number($("otherPrice").value)||0;$("otherName").value=$("otherNote").value=$("otherEmoji").value=$("otherPrice").value="";$("otherQty").value=1;renderFilters();renderProducts();update();toast("Producto agregado.")}
function copyList(){const list=selected();if(!list.length)return toast("Tu lista está vacía.");const grouped={};list.forEach(x=>(grouped[x.category]??=[]).push(x));let t="Lista de súper:\n\n";Object.entries(grouped).forEach(([c,items])=>{t+=c+":\n";items.forEach(x=>t+=`- ${x.quantity} x ${x.emoji} ${x.name} | ${money(x.unitPrice)} c/u | Total: ${money(x.total)}\n`);t+="\n"});const total=list.reduce((a,x)=>a+x.total,0),budget=Number($("budget").value)||0,rem=budget-total;t+=`Total estimado: ${money(total)}\nPresupuesto: ${money(budget)}\n${rem>=0?"Restante":"Excedente"}: ${money(Math.abs(rem))}`;navigator.clipboard.writeText(t).then(()=>toast("Lista copiada."))}
function downloadTemplate(){const rows=products.map(p=>({Producto:p.name,Categoría:p.category,Emoji:p.emoji,Nota:notes[p.id]||p.note||"",Cantidad:quantities[p.id]||0,"Precio unitario":prices[p.id]||0,Favorito:favorites[p.id]?"Sí":"No"}));const ws=XLSX.utils.json_to_sheet(rows);ws["!cols"]=[{wch:34},{wch:28},{wch:9},{wch:28},{wch:10},{wch:16},{wch:11}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Lista de súper");XLSX.writeFile(wb,"Plantilla_Lista_Super_Zamarripa.xlsx")}
function val(row,aliases){const map={};Object.keys(row).forEach(k=>map[norm(k)]=row[k]);for(const a of aliases)if(map[norm(a)]!==undefined)return map[norm(a)];return ""}const yes=v=>["si","sí","yes","true","1","x","favorito"].includes(norm(v));async function importSheet(file){try{const data=await file.arrayBuffer(),wb=XLSX.read(data),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{defval:""});let recognized=0,created=0,errors=0;rows.forEach((row,index)=>{const name=String(val(row,["Producto","Nombre","Nombre del producto"])).trim();if(!name){errors++;return}const category=String(val(row,["Categoría","Categoria"])).trim()||"Otros",emoji=String(val(row,["Emoji","Icono","Ícono"])).trim()||"🛒",note=String(val(row,["Nota","Notas","Observaciones"])).trim(),qty=Math.max(0,Number(val(row,["Cantidad","Qty"]))||0),price=Math.max(0,Number(val(row,["Precio unitario","Precio","Costo"]))||0),fav=yes(val(row,["Favorito","Favoritos","Favorite"]));let p=products.find(x=>norm(x.name)===norm(name));if(p)recognized++;else{p={id:"otros-importado-"+Date.now()+"-"+index,emoji,name,category,note};products.push(p);created++}if(category&&p.category==="Otros")p.category=category;if(emoji)p.emoji=emoji;if(note)notes[p.id]=note;quantities[p.id]=(quantities[p.id]||0)+qty;prices[p.id]=price;favorites[p.id]=fav});renderFilters();renderProducts();update();$("importStatus").textContent=`Importación completada: ${recognized} reconocidos, ${created} nuevos y ${errors} filas omitidas.`;$("importStatus").classList.add("show");toast("Archivo importado correctamente.")}catch(e){console.error(e);$("importStatus").textContent="No fue posible leer el archivo. Revisa los encabezados.";$("importStatus").classList.add("show");toast("Error al importar.")}}
async function exportDocx(){const list=selected();if(!list.length)return toast("Tu lista está vacía.");if(!window.docx)return toast("No se cargó la biblioteca de Word.");const {Document,Packer,Paragraph,TextRun,Table,TableRow,TableCell,WidthType,AlignmentType,HeadingLevel,ShadingType}=window.docx,total=list.reduce((a,x)=>a+x.total,0),qty=list.reduce((a,x)=>a+x.quantity,0),budget=Number($("budget").value)||0,rem=budget-total;const head=["Categoría","Producto","Nota","Cantidad","Precio unitario","Total"].map(t=>new TableCell({shading:{fill:"F4B183",type:ShadingType.CLEAR},children:[new Paragraph({children:[new TextRun({text:t,bold:true})]})]})),rows=[new TableRow({children:head})];list.sort((a,b)=>a.category.localeCompare(b.category)||a.name.localeCompare(b.name)).forEach(x=>rows.push(new TableRow({children:[new TableCell({children:[new Paragraph(x.category)]}),new TableCell({children:[new Paragraph(`${x.emoji} ${x.name}`)]}),new TableCell({children:[new Paragraph(x.note||"")]}),new TableCell({children:[new Paragraph(String(x.quantity))]}),new TableCell({children:[new Paragraph(money(x.unitPrice))]}),new TableCell({children:[new Paragraph(money(x.total))]})]})));const doc=new Document({sections:[{children:[new Paragraph({text:"LISTA SUPER ZAMARRIPA CARDENAS",heading:HeadingLevel.TITLE,alignment:AlignmentType.CENTER}),new Paragraph({text:`Fecha: ${new Date().toLocaleDateString("es-MX")}`,alignment:AlignmentType.CENTER}),new Paragraph({text:""}),new Table({width:{size:100,type:WidthType.PERCENTAGE},rows}),new Paragraph({text:""}),new Paragraph({children:[new TextRun({text:`Ingredientes distintos: ${list.length}`,bold:true})]}),new Paragraph({children:[new TextRun({text:`Cantidad total: ${qty}`,bold:true})]}),new Paragraph({children:[new TextRun({text:`Total estimado: ${money(total)}`,bold:true})]}),new Paragraph({children:[new TextRun({text:`Presupuesto: ${money(budget)}`,bold:true})]}),new Paragraph({children:[new TextRun({text:`${rem>=0?"Restante":"Excedente"}: ${money(Math.abs(rem))}`,bold:true})]})]}]});const blob=await Packer.toBlob(doc);saveAs(blob,"Lista_Super_Zamarripa_Cardenas.docx");toast("Documento Word descargado.")}
